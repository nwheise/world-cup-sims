# Builds and deploys the static site to GitHub Pages, and — on the schedule —
# refreshes site/data/results.json from openfootball first so the deployed
# probabilities track the real tournament.
#
# One workflow on purpose: commits pushed with GITHUB_TOKEN do not trigger
# other workflows, so the scheduled run must deploy Pages itself after
# committing fresh results.
#
# One-time repo setup: Settings -> Pages -> Source: "GitHub Actions".

name: site

on:
  push:
    branches: [main]
  schedule:
    # Every 2 hours during the tournament (June 11 – July 19, 2026).
    # update_results.py becomes a no-op after Aug 1; feel free to delete the
    # schedule after the final.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh live results (scheduled / manual runs only)
        if: github.event_name != 'push'
        run: |
          python3 scripts/update_results.py
          if [ -n "$(git status --porcelain site/data/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/results.json
            git commit -m "Update live results from openfootball"
            git push
          else
            echo "results unchanged"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests (JS simulator + Python data pipeline)
        run: |
          node --test "tests/**/*.test.mjs"
          python3 -m unittest test_update_results

      - name: Stamp asset versions (cache busting)
        # GitHub Pages caches assets for 10 minutes; without versioned URLs a
        # deploy can leave browsers running a stale or mixed ES-module graph
        # until users hard-clear the site (which wipes their localStorage).
        # Suffixing every .js/.css reference with the commit SHA makes each
        # deploy fetch atomically. Deploy-time only — repo files stay clean.
        run: |
          V="${GITHUB_SHA:0:8}"
          sed -i "s/\.js\"/.js?v=$V\"/g; s/\.css\"/.css?v=$V\"/g" site/index.html
          sed -i "s/\.js\"/.js?v=$V\"/g" site/js/*.js
          grep -n "?v=$V" site/index.html >/dev/null  # fail loudly if nothing stamped

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
