# Builds and deploys the static site to GitHub Pages, and — on the schedule —
# refreshes site/data/results.json from openfootball first so the deployed
# probabilities track the real tournament.
#
# One workflow on purpose: commits pushed with GITHUB_TOKEN do not trigger
# other workflows, so the scheduled run must deploy Pages itself after
# committing fresh results.
#
# One-time repo setup: Settings -> Pages -> Source: "GitHub Actions".

name: site

on:
  push:
    branches: [main]
  schedule:
    # Every 2 hours during the tournament (June 11 – July 19, 2026).
    # update_results.py becomes a no-op after Aug 1; feel free to delete the
    # schedule after the final.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh live results (scheduled / manual runs only)
        if: github.event_name != 'push'
        run: |
          python3 scripts/update_results.py
          if [ -n "$(git status --porcelain site/data/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/results.json
            git commit -m "Update live results from openfootball"
            git push
          else
            echo "results unchanged"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run simulator tests
        run: node --test "tests/**/*.test.mjs"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
