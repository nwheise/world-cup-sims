# Builds and deploys the static site to GitHub Pages.
#
# During the tournament (June 11 – July 19, 2026) this workflow also refreshed
# site/data/results.json from the ESPN scoreboard on an hourly cron. The
# tournament is over and the results are final, so the scheduled refresh has
# been removed — results.json is now just another committed static file.
# (scripts/update_results.py stays in the repo as a manual tool.)
#
# One-time repo setup: Settings -> Pages -> Source: "GitHub Actions".

name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests (JS simulator + Python data pipeline)
        run: |
          node --test "tests/**/*.test.mjs"
          python3 -m unittest test_update_results

      - name: Stamp asset versions (cache busting)
        # GitHub Pages caches assets for 10 minutes; without versioned URLs a
        # deploy can leave browsers running a stale or mixed ES-module graph
        # until users hard-clear the site (which wipes their localStorage).
        # Suffixing every .js/.css reference with the commit SHA makes each
        # deploy fetch atomically. Deploy-time only — repo files stay clean.
        run: |
          V="${GITHUB_SHA:0:8}"
          sed -i "s/\.js\"/.js?v=$V\"/g; s/\.css\"/.css?v=$V\"/g" site/index.html
          sed -i "s/\.js\"/.js?v=$V\"/g" site/js/*.js
          grep -n "?v=$V" site/index.html >/dev/null  # fail loudly if nothing stamped

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
